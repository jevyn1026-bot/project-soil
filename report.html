* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f6f9;
    min-height: 100vh;
}

/* =========================
   NAVBAR
========================= */

.custom-navbar {
    background: #fff;
    box-shadow: 0 2px 5px rgba(0,0,0,.08);
    padding: 1rem 2rem;
    position: relative;
    z-index: 1000;
}

.custom-nav-container {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.custom-logo {
    display: flex;
    align-items: center;
    gap: .5rem;
    text-decoration: none;
    font-size: 1.4rem;
    font-weight: bold;
    color: #2e7d32;
}

.custom-nav-menu {
    display: flex;
    align-items: center;
}

.custom-nav-menu a {
    margin-left: 1.5rem;
    text-decoration: none;
    color: #2c3e50;
    font-weight: 500;
    padding-bottom: 4px;
}

.custom-nav-menu a.active {
    color: #2e7d32;
    border-bottom: 2px solid #2e7d32;
}

.menu-toggle {
    display: none;
    background: none;
    border: none;
    font-size: 28px;
    cursor: pointer;
}

/* =========================
   CONTAINER
========================= */

.container {
    width: 95%;
    max-width: 900px;
    margin: 30px auto;
    background: #fff;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0,0,0,.1);
}

h2 {
    color: #2e7d32;
    margin-bottom: 20px;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 8px;
    font-weight: bold;
}

input,
textarea,
select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
    background: #fff;
}

input[readonly] {
    background: #f5f5f5;
}

textarea {
    resize: vertical;
    min-height: 120px;
}

/* =========================
   GPS
========================= */

#trigger-gps-btn {
    margin-top: 15px;
    padding: 12px;
    width: 100%;
    border: none;
    background: #1976d2;
    color: white;
    font-size: 16px;
    border-radius: 8px;
    cursor: pointer;
}

#trigger-gps-btn:hover {
    background: #1565c0;
}

#trigger-gps-btn:disabled {
    background: #90a4ae;
    cursor: not-allowed;
}

#gps-status {
    margin-top: 12px;
    font-weight: bold;
    line-height: 1.5;
}

/* =========================
   MAP
========================= */

#report-mini-map {
    height: 300px;
    margin-top: 15px;
    border-radius: 10px;
    border: 1px solid #ccc;
    overflow: hidden;
}

.location-row {
    display: flex;
    gap: 15px;
    margin-top: 15px;
}

.location-row div {
    flex: 1;
}

/* =========================
   PHOTO
========================= */

.photo-buttons {
    display: flex;
    gap: 10px;
    margin-top: 10px;
}

.photo-btn {
    flex: 1;
    background: #1976d2;
    color: white;
    padding: 12px;
    border-radius: 8px;
    text-align: center;
    cursor: pointer;
    font-weight: bold;
}

.photo-btn:hover {
    background: #1565c0;
}

.preview-container {
    margin-top: 15px;
    text-align: center;
}

#previewImage {
    max-width: 100%;
    max-height: 400px;
    border-radius: 10px;
    object-fit: contain;
}

#photoStatus {
    margin-top: 8px;
}

/* =========================
   SUBMIT
========================= */

#submit-btn {
    margin-top: 25px;
    width: 100%;
    padding: 15px;
    background: #2e7d32;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
}

#submit-btn:hover {
    background: #256628;
}

#submit-btn:disabled {
    background: #9e9e9e;
    cursor: not-allowed;
}

/* =========================
   STATUS
========================= */

#status-message {
    margin-top: 20px;
    font-weight: bold;
    text-align: left;
    line-height: 1.6;
    padding: 15px;
    border-radius: 8px;
    display: none;
    overflow-wrap: anywhere;
}

.success-box {
    background: #e8f5e9;
    border: 1px solid #a5d6a7;
    color: #1b5e20;
}

.error-box {
    background: #ffebee;
    border: 1px solid #ef9a9a;
    color: #c62828;
}

.warning-box {
    background: #fff8e1;
    border: 1px solid #ffe082;
    color: #8d6e00;
}

/* =========================
   MODAL
========================= */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.55);
    justify-content: center;
    align-items: center;
    z-index: 9999;
}

.modal-content {
    width: 90%;
    max-width: 360px;
    background: #fff;
    border-radius: 15px;
    overflow: hidden;
    animation: popup .25s ease;
}

@keyframes popup {
    from {
        transform: scale(.85);
        opacity: 0;
    }

    to {
        transform: scale(1);
        opacity: 1;
    }
}

.modal-header {
    background: #2e7d32;
    color: #fff;
    padding: 18px;
    text-align: center;
}

.modal-header i {
    font-size: 34px;
    margin-bottom: 10px;
}

.modal-content p {
    padding: 22px;
    text-align: center;
    color: #555;
    line-height: 1.5;
}

.modal-buttons {
    display: flex;
}

.modal-buttons button {
    flex: 1;
    border: none;
    padding: 15px;
    font-size: 16px;
    cursor: pointer;
}

.login-btn {
    background: #2e7d32;
    color: #fff;
}

.cancel-btn {
    background: #f2f2f2;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 768px) {

    .custom-navbar {
        padding: 1rem;
    }

    .menu-toggle {
        display: block;
    }

    .custom-nav-menu {
        display: none;
        flex-direction: column;
        position: absolute;
        top: 70px;
        left: 0;
        width: 100%;
        background: #fff;
        box-shadow: 0 5px 10px rgba(0,0,0,.1);
        padding: 1rem;
    }

    .custom-nav-menu.show {
        display: flex;
    }

    .custom-nav-menu a {
        margin: 12px 0;
    }

    .container {
        width: 94%;
        margin: 20px auto;
        padding: 18px;
    }

    .location-row {
        flex-direction: column;
        gap: 0;
    }

    .photo-buttons {
        flex-direction: column;
    }

    #report-mini-map {
        height: 260px;
    }
}

@media (max-width: 480px) {

    h2 {
        font-size: 22px;
    }

    input,
    textarea,
    select,
    button {
        font-size: 16px;
    }

    .container {
        padding: 15px;
    }
}

</div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="js/main.js"></script><script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        /*
         * ====================================================
         * PROJECTSUN REPORT SYSTEM
         * ====================================================
         *
         * GPS coordinates are always saved.
         *
         * Barangay is detected by:
         *
         *     /api/barangay
         *
         * The browser does NOT contain a hard-coded list
         * of barangays.
         *
         * This makes the frontend compatible with different
         * devices and different barangays.
         */


        let imageData = "";

        let gpsMarker = null;

        let currentCoordinates = {
            latitude: null,
            longitude: null
        };


        /* ====================================================
           ELEMENTS
        ==================================================== */

        const form =
            document.getElementById(
                "pollution-report-form"
            );

        const barangayInput =
            document.getElementById(
                "report-barangay"
            );

        const latitudeInput =
            document.getElementById(
                "report-lat"
            );

        const longitudeInput =
            document.getElementById(
                "report-lng"
            );

        const gpsStatus =
            document.getElementById(
                "gps-status"
            );

        const gpsButton =
            document.getElementById(
                "trigger-gps-btn"
            );

        const submitButton =
            document.getElementById(
                "submit-btn"
            );

        const statusMessage =
            document.getElementById(
                "status-message"
            );

        const previewImage =
            document.getElementById(
                "previewImage"
            );

        const photoStatus =
            document.getElementById(
                "photoStatus"
            );


        /* ====================================================
           MAP
        ==================================================== */

        const miniMap =
            L.map(
                "report-mini-map"
            ).setView(
                [14.5764, 121.0851],
                13
            );


        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                attribution:
                    "© OpenStreetMap contributors"
            }
        ).addTo(miniMap);


        /* ====================================================
           STATUS HELPER
        ==================================================== */

        function showStatus(
            message,
            type
        ) {

            statusMessage.style.display =
                "block";

            statusMessage.className =
                type === "success"
                    ? "success-box"
                    : type === "warning"
                    ? "warning-box"
                    : "error-box";

            statusMessage.textContent =
                message;
        }


        /* ====================================================
           BARANGAY NORMALIZATION
        ==================================================== */

        function normalizeBarangayName(
            value
        ) {

            if (
                value === null ||
                value === undefined
            ) {
                return "";
            }

            let name =
                String(value).trim();

            if (!name) {
                return "";
            }

            name =
                name.replace(
                    /\s+/g,
                    " "
                );

            name =
                name.replace(
                    /^(barangay|brgy\.?|bgy\.?)\s+/i,
                    ""
                );

            return name;
        }


        /* ====================================================
           BARANGAY DETECTION
        ==================================================== */

        async function detectBarangay(
            latitude,
            longitude
        ) {

            barangayInput.value =
                "Detecting...";


            try {

                const response =
                    await fetch(
                        `/api/barangay?lat=${encodeURIComponent(latitude)}&lng=${encodeURIComponent(longitude)}`,
                        {
                            method: "GET",
                            headers: {
                                "Accept":
                                    "application/json"
                            },
                            cache: "no-store"
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        `Barangay API returned ${response.status}`
                    );
                }


                const data =
                    await response.json();


                console.log(
                    "Barangay API response:",
                    data
                );


                const detected =
                    normalizeBarangayName(
                        data?.barangay
                    );


                if (detected) {

                    barangayInput.value =
                        detected;

                    gpsStatus.textContent =
                        `✅ GPS location acquired — Barangay ${detected}`;

                    gpsStatus.style.color =
                        "green";

                    return detected;
                }


                /*
                 * Do NOT write "Unknown".
                 *
                 * The GPS coordinates remain valid.
                 */

                barangayInput.value =
                    "";

                gpsStatus.textContent =
                    "✅ GPS acquired. Barangay could not be resolved.";

                gpsStatus.style.color =
                    "#e67e22";

                return "";

            } catch (error) {

                console.error(
                    "Barangay detection error:",
                    error
                );


                /*
                 * Do not destroy valid GPS data.
                 */

                barangayInput.value =
                    "";

                gpsStatus.textContent =
                    "✅ GPS acquired. Barangay lookup temporarily unavailable.";

                gpsStatus.style.color =
                    "#e67e22";

                return "";
            }
        }


        /* ====================================================
           GPS ACQUISITION
        ==================================================== */

        async function acquireLiveLocation() {

            if (
                !navigator.geolocation
            ) {

                gpsStatus.textContent =
                    "❌ This device does not support GPS location.";

                gpsStatus.style.color =
                    "red";

                return;
            }


            gpsButton.disabled =
                true;

            gpsStatus.textContent =
                "📡 Getting your GPS location...";

            gpsStatus.style.color =
                "#e67e22";


            navigator.geolocation.getCurrentPosition(

                async function (position) {

                    const latitude =
                        position.coords.latitude;

                    const longitude =
                        position.coords.longitude;


                    /*
                     * Save the REAL coordinates.
                     */

                    currentCoordinates =
                    {
                        latitude,
                        longitude
                    };


                    latitudeInput.value =
                        latitude.toFixed(6);

                    longitudeInput.value =
                        longitude.toFixed(6);


                    /*
                     * Move map.
                     */

                    miniMap.setView(
                        [
                            latitude,
                            longitude
                        ],
                        17
                    );


                    /*
                     * Update marker.
                     */

                    if (gpsMarker) {

                        gpsMarker.setLatLng(
                            [
                                latitude,
                                longitude
                            ]
                        );

                    } else {

                        gpsMarker =
                            L.marker(
                                [
                                    latitude,
                                    longitude
                                ]
                            ).addTo(
                                miniMap
                            );
                    }


                    /*
                     * Detect barangay.
                     *
                     * A failure here does NOT erase GPS.
                     */

                    await detectBarangay(
                        latitude,
                        longitude
                    );


                    gpsButton.disabled =
                        false;

                },

                function (error) {

                    gpsButton.disabled =
                        false;


                    switch (
                        error.code
                    ) {

                        case error.PERMISSION_DENIED:

                            gpsStatus.textContent =
                                "❌ Location permission denied. Please allow location access.";

                            break;


                        case error.POSITION_UNAVAILABLE:

                            gpsStatus.textContent =
                                "❌ GPS position is unavailable.";

                            break;


                        case error.TIMEOUT:

                            gpsStatus.textContent =
                                "❌ GPS request timed out. Please try again.";

                            break;


                        default:

                            gpsStatus.textContent =
                                "❌ Unable to obtain GPS location.";

                    }


                    gpsStatus.style.color =
                        "red";
                },

                {
                    enableHighAccuracy: true,
                    timeout: 20000,
                    maximumAge: 0
                }
            );
        }


        /* ====================================================
           GPS BUTTON
        ==================================================== */

        gpsButton.addEventListener(
            "click",
            acquireLiveLocation
        );


        /* ====================================================
           PHOTO
        ==================================================== */

        function loadPhoto(
            file
        ) {

            if (!file) {
                return;
            }


            if (
                !file.type.startsWith(
                    "image/"
                )
            ) {

                photoStatus.textContent =
                    "❌ Please select an image.";

                return;
            }


            const reader =
                new FileReader();


            reader.onload =
                function (event) {

                    imageData =
                        event.target.result;


                    previewImage.src =
                        imageData;

                    previewImage.style.display =
                        "block";

                    photoStatus.textContent =
                        "✅ Photo selected";

                };


            reader.onerror =
                function () {

                    photoStatus.textContent =
                        "❌ Could not read the photo.";

                };


            reader.readAsDataURL(
                file
            );
        }


        document
            .getElementById(
                "cameraInput"
            )
            .addEventListener(
                "change",
                function () {

                    loadPhoto(
                        this.files[0]
                    );

                }
            );


        document
            .getElementById(
                "galleryInput"
            )
            .addEventListener(
                "change",
                function () {

                    loadPhoto(
                        this.files[0]
                    );

                }
            );


        /* ====================================================
           SUBMIT REPORT
        ==================================================== */

        form.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                /*
                 * LOGIN CHECK
                 */

                const token =
                    localStorage.getItem(
                        "token"
                    );


                if (!token) {

                    document
                        .getElementById(
                            "loginModal"
                        )
                        .style.display =
                        "flex";

                    return;
                }


                /*
                 * PHOTO CHECK
                 */

                if (!imageData) {

                    showStatus(
                        "⚠️ Please take or upload a photo first.",
                        "error"
                    );

                    return;
                }


                /*
                 * GPS CHECK
                 */

                const latitude =
                    Number(
                        latitudeInput.value
                    );

                const longitude =
                    Number(
                        longitudeInput.value
                    );


                if (
                    !Number.isFinite(
                        latitude
                    ) ||
                    !Number.isFinite(
                        longitude
                    )
                ) {

                    showStatus(
                        "⚠️ Please acquire your GPS location before submitting.",
                        "error"
                    );

                    return;
                }


                /*
                 * Barangay can be empty.
                 *
                 * The backend still receives the coordinates.
                 */

                const barangay =
                    normalizeBarangayName(
                        barangayInput.value
                    );


                const submissionTime =
                    new Date();


                const report = {

                    type:
                        document.getElementById(
                            "type"
                        ).value,

                    barangay:
                        barangay || null,

                    description:
                        document.getElementById(
                            "report-desc"
                        ).value.trim(),

                    latitude:
                        latitude,

                    longitude:
                        longitude,

                    photo:
                        imageData,

                    status:
                        "Pending",

                    timestamp:
                        submissionTime.toISOString()
                };


                submitButton.disabled =
                    true;

                submitButton.innerText =
                    "Submitting...";


                statusMessage.style.display =
                    "none";


                try {

                    const response =
                        await fetch(
                            "/reports",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json",

                                    "Authorization":
                                        `Bearer ${token}`
                                },

                                body:
                                    JSON.stringify(
                                        report
                                    )
                            }
                        );


                    /*
                     * Authentication failure
                     */

                    if (
                        response.status === 401
                    ) {

                        showStatus(
                            "🔒 Your session has expired. Please log in again.",
                            "error"
                        );

                        submitButton.disabled =
                            false;

                        submitButton.innerText =
                            "Submit Report";

                        return;
                    }


                    const responseText =
                        await response.text();


                    let result = {};

                    try {

                        result =
                            JSON.parse(
                                responseText
                            );

                    } catch (parseError) {

                        console.error(
                            "Server returned non-JSON:",
                            responseText
                        );
                    }


                    if (
                        !response.ok
                    ) {

                        throw new Error(
                            result.error ||
                            "The server could not process the report."
                        );
                    }


                    /*
                     * Use server result if available.
                     */

                    const detectedBarangay =
                        normalizeBarangayName(
                            result?.report?.barangay
                        ) ||
                        barangay;


                    const finalBarangay =
                        detectedBarangay ||
                        "GPS coordinates recorded";


                    const formattedDate =
                        submissionTime.toLocaleDateString(
                            undefined,
                            {
                                year: "numeric",
                                month: "long",
                                day: "numeric"
                            }
                        );


                    const formattedTime =
                        submissionTime.toLocaleTimeString(
                            undefined,
                            {
                                hour: "2-digit",
                                minute: "2-digit",
                                second: "2-digit"
                            }
                        );


                    statusMessage.style.display =
                        "block";

                    statusMessage.className =
                        "success-box";


                    statusMessage.innerHTML = `
                        🎉 <strong>Report successfully submitted!</strong><br><br>

                        📅 <strong>Date:</strong>
                        ${formattedDate}<br>

                        📍 <strong>Barangay:</strong>
                        ${finalBarangay}<br>

                        🌐 <strong>GPS:</strong>
                        ${latitude.toFixed(6)},
                        ${longitude.toFixed(6)}<br>

                        ⏰ <strong>Time:</strong>
                        ${formattedTime}
                    `;


                    /*
                     * Reset form.
                     */

                    form.reset();


                    latitudeInput.value =
                        "";

                    longitudeInput.value =
                        "";

                    barangayInput.value =
                        "";

                    imageData =
                        "";

                    currentCoordinates =
                    {
                        latitude: null,
                        longitude: null
                    };


                    previewImage.src =
                        "";

                    previewImage.style.display =
                        "none";

                    photoStatus.textContent =
                        "No photo selected.";


                    if (gpsMarker) {

                        miniMap.removeLayer(
                            gpsMarker
                        );

                        gpsMarker =
                            null;
                    }


                    gpsStatus.textContent =
                        "Report submitted successfully.";

                    gpsStatus.style.color =
                        "green";


                } catch (error) {

                    console.error(
                        "Report submission error:",
                        error
                    );


                    showStatus(
                        "❌ " +
                        (
                            error.message ||
                            "Could not submit the report."
                        ),
                        "error"
                    );

                } finally {

                    submitButton.disabled =
                        false;

                    submitButton.innerText =
                        "Submit Report";
                }

            }
        );


        /* ====================================================
           MOBILE NAVIGATION
        ==================================================== */

        const menuToggle =
            document.getElementById(
                "menu-toggle"
            );

        const navMenu =
            document.querySelector(
                ".custom-nav-menu"
            );


        if (
            menuToggle &&
            navMenu
        ) {

            menuToggle.addEventListener(
                "click",
                function () {

                    navMenu.classList.toggle(
                        "show"
                    );

                }
            );
        }


        /* ====================================================
           LOGIN MODAL
        ==================================================== */

        const token =
            localStorage.getItem(
                "token"
            );


        const loginModal =
            document.getElementById(
                "loginModal"
            );


        if (!token) {

            loginModal.style.display =
                "flex";
        }


        document
            .getElementById(
                "loginNowBtn"
            )
            .addEventListener(
                "click",
                function () {

                    window.location.href =
                        "login.html";
                }
            );


        document
            .getElementById(
                "cancelBtn"
            )
            .addEventListener(
                "click",
                function () {

                    loginModal.style.display =
                        "none";

                    window.location.href =
                        "Soil.html";
                }
            );


        /*
         * ====================================================
         * INITIAL GPS REQUEST
         * ====================================================
         *
         * We don't automatically request GPS immediately on
         * every device because browsers may block or restrict
         * automatic location requests.
         *
         * The user can press the GPS button.
         */

        gpsStatus.textContent =
            "📍 Press 'Refresh My GPS Location' to detect your location.";

        gpsStatus.style.color =
            "#555";

    }
);

</script></body>
</html>
