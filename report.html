<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ProjectSUN - Soil Reporting</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6f9;
}

header{
background:#2e7d32;
color:white;
padding:18px 30px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:28px;
font-weight:bold;
}

nav a{
color:white;
text-decoration:none;
margin-left:20px;
font-weight:bold;
}

nav a:hover{
text-decoration:underline;
}

.container{
width:95%;
max-width:900px;
margin:30px auto;
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

h2{
color:#2e7d32;
margin-bottom:20px;
}

label{
display:block;
margin-top:15px;
margin-bottom:8px;
font-weight:bold;
}

input,
textarea,
select{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

textarea{
resize:vertical;
min-height:120px;
}

#trigger-gps-btn{
margin-top:15px;
padding:12px;
width:100%;
border:none;
background:#1976d2;
color:white;
font-size:16px;
border-radius:8px;
cursor:pointer;
}

#gps-status{
margin-top:12px;
font-weight:bold;
}

#report-mini-map{
height:300px;
margin-top:15px;
border-radius:10px;
border:1px solid #ccc;
}

.location-row{
display:flex;
gap:15px;
margin-top:15px;
}

.location-row div{
flex:1;
}

#submit-btn{
margin-top:25px;
width:100%;
padding:15px;
background:#2e7d32;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

#status-message{
margin-top:20px;
font-weight:bold;
text-align:left;
line-height: 1.6;
padding: 15px;
border-radius: 8px;
display: none;
}

.success-box {
background-color: #e8f5e9;
border: 1px solid #a5d6a7;
color: #1b5e20;
}

.error-box {
background-color: #ffebee;
border: 1px solid #ef9a9a;
color: #c62828;
}

</style>

</head>

<body>

<header>

<div class="logo">
🌱 ProjectSUN
</div>

<nav>

<a href="Soil.html">Home</a>

<a href="map.html">Map</a>

<a href="dashboard.html">Dashboard</a>

<a href="report.html">Report</a>

</nav>

</header>

<div class="container">

<h2>Soil Pollution Report</h2>
<form id="pollution-report-form">

<label>Pollution Type</label>

<select id="type" name="type" required>
    <option value="">Select Pollution Type</option>

    <option value="Illegal Waste Dumping">
        Illegal Waste Dumping
    </option>

    <option value="Plastic Waste">
        Plastic Waste
    </option>

    <option value="Chemical Pollution">
        Chemical Pollution
    </option>

    <option value="Oil and Fuel Spill">
        Oil and Fuel Spill
    </option>

    <option value="Construction Debris">
        Construction Debris
    </option>

    <option value="Agricultural Waste">
        Agricultural Waste
    </option>

    <option value="Electronic Waste (E-Waste)">
        Electronic Waste (E-Waste)
    </option>

    <option value="Industrial Waste">
        Industrial Waste
    </option>

    <option value="Hazardous Waste">
        Hazardous Waste
    </option>

    <option value="Other Environmental Concerns">
        Other Environmental Concerns
    </option>

</select>

<label>Barangay</label>

<input
    type="text"
    id="report-barangay"
    placeholder="Detecting barangay..."
    readonly
>

<label>Description</label>

<textarea
id="report-desc"
placeholder="Describe the pollution..."
required></textarea>

<label><strong>Photo Evidence *</strong></label>

<div class="photo-buttons">

    <label class="photo-btn">
        📸 Take Photo
        <input
            type="file"
            id="cameraInput"
            accept="image/*"
            capture="environment"
            hidden>
    </label>

    <label class="photo-btn">
        🖼 Upload From Gallery
        <input
            type="file"
            id="galleryInput"
            accept="image/*"
            hidden>
    </label>

</div>

<div class="preview-container">

    <img
        id="previewImage"
        src=""
        style="display:none;max-width:100%;border-radius:10px;">
<p id="photoStatus">
        No photo selected.
    </p>

</div>

<label>GPS Location</label>

<button
type="button"
id="trigger-gps-btn">

📍 Refresh My GPS Location

</button>

<div id="gps-status">
        Initializing GPS...

</div>

<div id="report-mini-map"></div>

<div class="location-row">

<div>

<label>Latitude</label>

<input
type="text"
id="report-lat"
readonly>

</div>

<div>

<label>Longitude</label>

<input
type="text"
id="report-lng"
readonly>

</div>

</div>

<button
type="submit"
id="submit-btn">

Submit Report

</button>

<div id="status-message"></div>

</form>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {

let imageData = "";

const miniMap = L.map("report-mini-map").setView([14.5764,121.0851],13);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
    attribution:"© OpenStreetMap contributors"
}).addTo(miniMap);

let gpsMarker = null;

function acquireLiveLocation(){

    const gpsStatus =
        document.getElementById("gps-status");

    gpsStatus.textContent =
        "📡 Getting GPS location...";

    gpsStatus.style.color = "#e67e22";

    if(!navigator.geolocation){

        gpsStatus.textContent =
            "❌ Geolocation is not supported.";

        gpsStatus.style.color = "red";

        return;

    }

    navigator.geolocation.getCurrentPosition(

        function(position){

const lat = position.coords.latitude;
const lng = position.coords.longitude;

document.getElementById("report-barangay").value =
    "Detecting...";

            document.getElementById("report-lat").value =
                lat.toFixed(6);

            document.getElementById("report-lng").value =
                lng.toFixed(6);

            miniMap.setView([lat,lng],17);

            if(gpsMarker){

                gpsMarker.setLatLng([lat,lng]);

            }else{

                gpsMarker =
                    L.marker([lat,lng]).addTo(miniMap);

            }

            gpsStatus.textContent =
                "✅ GPS Location Acquired";

            gpsStatus.style.color = "green";

        },

        function(error){

            switch(error.code){

                case error.PERMISSION_DENIED:
                    gpsStatus.textContent =
                        "❌ Permission denied.";
                    break;

                case error.POSITION_UNAVAILABLE:
                    gpsStatus.textContent =
                        "❌ Position unavailable.";
                    break;

                case error.TIMEOUT:
                    gpsStatus.textContent =
                        "❌ GPS request timed out.";
                    break;

                default:
                    gpsStatus.textContent =
                        "❌ Unknown GPS error.";

            }

            gpsStatus.style.color = "red";

        },

        {
            enableHighAccuracy:true,
            timeout:15000,
            maximumAge:0
        }

    );

}

document
.getElementById("trigger-gps-btn")
.addEventListener("click", acquireLiveLocation);

function loadPhoto(file){

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(e){

        imageData = e.target.result;

        document.getElementById("previewImage").src =
            imageData;

        document.getElementById("previewImage").style.display =
            "block";

        document.getElementById("photoStatus").textContent =
            "✅ Photo selected";

    };

    reader.readAsDataURL(file);

}

document.getElementById("cameraInput")
.addEventListener("change", function(){

    loadPhoto(this.files[0]);

});

document.getElementById("galleryInput")
.addEventListener("change", function(){

    loadPhoto(this.files[0]);

});

document
.getElementById("pollution-report-form")
.addEventListener("submit", async function(e){

    e.preventDefault();

    const submitBtn =
        document.getElementById("submit-btn");

    const status =
        document.getElementById("status-message");

    submitBtn.disabled = true;
    submitBtn.innerText = "Submitting...";

if(imageData === ""){

    status.style.display = "block";
    status.className = "error-box";

    status.textContent =
        "⚠️ Please take or upload a photo first.";

    submitBtn.disabled = false;
    submitBtn.innerText = "Submit Report";

    return;

}

    const submissionTime = new Date();

    const report = {

        type: document.getElementById("type").value,

        description: document.getElementById("report-desc").value,

        latitude: parseFloat(
            document.getElementById("report-lat").value
        ),

        longitude: parseFloat(
            document.getElementById("report-lng").value
        ),

        photo: imageData,

        status: "Pending",

        timestamp: submissionTime

    };

    try{

        const response = await fetch("/reports",{
method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify(report)

        });

        const result = await response.json();

        if (response.ok) {

const hours = String(submissionTime.getHours()).padStart(2, "0");
const minutes = String(submissionTime.getMinutes()).padStart(2, "0");
const seconds = String(submissionTime.getSeconds()).padStart(2, "0");
const milliseconds = String(submissionTime.getMilliseconds()).padStart(3, "0");

// Two extra decimal digits (00-99)
const decimal = String(Math.floor(Math.random() * 100)).padStart(2, "0");

const formattedTime =
    `${hours}:${minutes}:${seconds}.${milliseconds}.${decimal}`;            
            const formattedDate = submissionTime.toLocaleDateString();

            status.style.display = "block";
            status.className = "success-box";
            
            status.innerHTML = `
                🎉 <strong>You successfully reported!</strong><br><br>
                📅 <strong>Date:</strong> ${formattedDate}<br>
                📍 <strong>Location:</strong> Brgy. ${report.barangay} (${report.latitude}, ${report.longitude})<br>
                ⏰ <strong>Timestamp:</strong> ${formattedTime}
            `;

            document
            .getElementById("pollution-report-form")
            .reset();

            document.getElementById("report-lat").value = "";
            document.getElementById("report-lng").value = "";

            imageData = "";

            document.getElementById("previewImage").style.display = "none";
            document.getElementById("previewImage").src = "";
            document.getElementById("photoStatus").textContent =
                "No photo selected.";

            if(gpsMarker){

                miniMap.removeLayer(gpsMarker);

                gpsMarker = null;

            }

            acquireLiveLocation();

        }else{

            status.style.display = "block";
            status.className = "error-box";

            status.textContent =
                "❌ Failed to submit report.";

        }

    }catch(err){

        console.error(err);

        status.style.display = "block";
        status.className = "error-box";

        status.textContent =
            "❌ Cannot connect to the server.";

    }

    submitBtn.disabled = false;

    submitBtn.innerText = "Submit Report";

});

});

async function detectBarangay(lat, lng) {

    try {

        const response = await fetch(
            `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}`
        );

        const data = await response.json();

console.log(data.address);

const address = data.address || {};

const barangay =
    address.suburb ||
    address.neighbourhood ||
    address.village ||
    address.quarter ||
    address.hamlet ||
    address.city_district ||
    address.residential ||
    "Unknown";

document.getElementById("report-barangay").value = barangay;

    } catch (err) {

        console.error(err);

        document.getElementById("report-barangay").value =
            "Unknown";

    }

}

</script>

</body>
</html>
