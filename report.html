<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ProjectSUN - Soil Reporting</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f9;
}

.container{
    width:95%;
    max-width:900px;
    margin:30px auto;
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

h2{
    color:#2e7d32;
    margin-bottom:20px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:8px;
    font-weight:bold;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

textarea{
    resize:vertical;
    min-height:120px;
}

#trigger-gps-btn{
    margin-top:15px;
    padding:12px;
    width:100%;
    border:none;
    background:#1976d2;
    color:white;
    font-size:16px;
    border-radius:8px;
    cursor:pointer;
}

#gps-status{
    margin-top:12px;
    font-weight:bold;
}

#report-mini-map{
    height:300px;
    margin-top:15px;
    border-radius:10px;
    border:1px solid #ccc;
}

.location-row{
    display:flex;
    gap:15px;
    margin-top:15px;
}

.location-row div{
    flex:1;
}

#submit-btn{
    margin-top:25px;
    width:100%;
    padding:15px;
    background:#2e7d32;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}

#status-message{
    margin-top:20px;
    font-weight:bold;
    text-align:left;
    line-height:1.6;
    padding:15px;
    border-radius:8px;
    display:none;
}

.success-box{
    background:#e8f5e9;
    border:1px solid #a5d6a7;
    color:#1b5e20;
}

.error-box{
    background:#ffebee;
    border:1px solid #ef9a9a;
    color:#c62828;
}

.photo-buttons{
    display:flex;
    gap:10px;
    margin-top:10px;
}

.photo-btn{
    flex:1;
    background:#1976d2;
    color:white;
    padding:12px;
    border-radius:8px;
    text-align:center;
    cursor:pointer;
    font-weight:bold;
}

.preview-container{
    margin-top:15px;
    text-align:center;
}

#previewImage{
    max-width:100%;
    border-radius:10px;
}

:root {
    --primary-green: #2e7d32;
    --dark-neutral: #2c3e50;
    --light-bg: #f4f7f6;
    --white: #ffffff;
}

.custom-navbar{
    background:#fff;
    box-shadow:0 2px 5px rgba(0,0,0,.05);
    padding:1rem 2rem;
    position:relative;
    z-index:1000;
}

.custom-nav-container{
    max-width:1200px;
    margin:0 auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.custom-logo{
    display:flex;
    align-items:center;
    gap:.5rem;
    text-decoration:none;
    font-size:1.4rem;
    font-weight:bold;
    color:var(--primary-green);
}

.custom-nav-menu{
    display:flex;
    align-items:center;
}

.custom-nav-menu a{
    margin-left:1.5rem;
    text-decoration:none;
    color:var(--dark-neutral);
    font-weight:500;
    padding-bottom:4px;
}

.custom-nav-menu a.active{
    color:var(--primary-green);
    border-bottom:2px solid var(--primary-green);
}

.menu-toggle{
    display:none;
    background:none;
    border:none;
    font-size:28px;
    cursor:pointer;
}

@media (max-width:768px){

.menu-toggle{
    display:block;
}

.custom-nav-menu{
    display:none;
    flex-direction:column;
    position:absolute;
    top:70px;
    left:0;
    width:100%;
    background:#fff;
    box-shadow:0 5px 10px rgba(0,0,0,.1);
    padding:1rem;
}

.custom-nav-menu.show{
    display:flex;
}

.custom-nav-menu a{
    margin:12px 0;
}
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.modal-content{
    width:90%;
    max-width:360px;
    background:#fff;
    border-radius:15px;
    overflow:hidden;
    animation:popup .25s ease;
}

@keyframes popup{
    from{
        transform:scale(.85);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

.modal-header{
    background:#2e7d32;
    color:#fff;
    padding:18px;
    text-align:center;
}

.modal-header i{
    font-size:34px;
    margin-bottom:10px;
}

.modal-content p{
    padding:22px;
    text-align:center;
    color:#555;
    line-height:1.5;
}

.modal-buttons{
    display:flex;
}

.modal-buttons button{
    flex:1;
    border:none;
    padding:15px;
    font-size:16px;
    cursor:pointer;
}

.login-btn{
    background:#2e7d32;
    color:#fff;
}

.cancel-btn{
    background:#f2f2f2;
}

</style>

</head>

<body>

<header class="custom-navbar">
  <div class="custom-nav-container">

    <a href="Soil.html" class="custom-logo">
      <i class="fa-solid fa-leaf"></i>
      <span>ProjectSUN</span>
    </a>

    <button id="menu-toggle" class="menu-toggle">
      <i class="fa-solid fa-bars"></i>
    </button>

    <nav class="custom-nav-menu">
      <a href="Soil.html">Home</a>
      <a href="map.html">Map Dashboard</a>
      <a href="report.html">Report</a>
      <a href="citizen-dashboard.html">My Profile</a>
    </nav>

  </div>
</header>

<div class="container">

<h2>Soil Pollution Report</h2>
<form id="pollution-report-form">

<label>Pollution Type</label>

<select id="type" name="type" required>
    <option value="">Select Pollution Type</option>

    <option value="Illegal Waste Dumping">
        Illegal Waste Dumping
    </option>

    <option value="Plastic Waste">
        Plastic Waste
    </option>

    <option value="Chemical Pollution">
        Chemical Pollution
    </option>

    <option value="Oil and Fuel Spill">
        Oil and Fuel Spill
    </option>

    <option value="Construction Debris">
        Construction Debris
    </option>

    <option value="Agricultural Waste">
        Agricultural Waste
    </option>

    <option value="Electronic Waste (E-Waste)">
        Electronic Waste (E-Waste)
    </option>

    <option value="Industrial Waste">
        Industrial Waste
    </option>

    <option value="Hazardous Waste">
        Hazardous Waste
    </option>

    <option value="Other Environmental Concerns">
        Other Environmental Concerns
    </option>

</select>

<label>Barangay</label>

<input
    type="text"
    id="report-barangay"
    placeholder="Detecting barangay..."
    readonly
>

<label>Description</label>

<textarea
id="report-desc"
placeholder="Describe the pollution..."
required></textarea>

<label><strong>Photo Evidence *</strong></label>

<div class="photo-buttons">

    <label class="photo-btn">
        📸 Take Photo
        <input
            type="file"
            id="cameraInput"
            accept="image/*"
            capture="environment"
            hidden>
    </label>

    <label class="photo-btn">
        🖼 Upload From Gallery
        <input
            type="file"
            id="galleryInput"
            accept="image/*"
            hidden>
    </label>

</div>

<div class="preview-container">

    <img
        id="previewImage"
        src=""
        style="display:none;max-width:100%;border-radius:10px;">
<p id="photoStatus">
        No photo selected.
    </p>

</div>

<label>GPS Location</label>

<button
type="button"
id="trigger-gps-btn">

📍 Refresh My GPS Location

</button>

<div id="gps-status">
        Initializing GPS...

</div>

<div id="report-mini-map"></div>

<div class="location-row">

<div>

<label>Latitude</label>

<input
type="text"
id="report-lat"
readonly>

</div>

<div>

<label>Longitude</label>

<input
type="text"
id="report-lng"
readonly>

</div>

</div>

<button
type="submit"
id="submit-btn">

Submit Report

</button>

<div id="status-message"></div>

</form>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {

let imageData = "";

const miniMap = L.map("report-mini-map").setView([14.5764,121.0851],13);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
    attribution:"© OpenStreetMap contributors"
}).addTo(miniMap);

let gpsMarker = null;

function acquireLiveLocation(){

    const gpsStatus =
        document.getElementById("gps-status");

    gpsStatus.textContent =
        "📡 Getting GPS location...";

    gpsStatus.style.color = "#e67e22";

    if(!navigator.geolocation){

        gpsStatus.textContent =
            "❌ Geolocation is not supported.";

        gpsStatus.style.color = "red";

        return;

    }

    navigator.geolocation.getCurrentPosition(

        function(position){

const lat = position.coords.latitude;
const lng = position.coords.longitude;

document.getElementById("report-barangay").value =
    "Detecting...";

detectBarangay(lat, lng);

            document.getElementById("report-lat").value =
                lat.toFixed(6);

            document.getElementById("report-lng").value =
                lng.toFixed(6);

            miniMap.setView([lat,lng],17);

            if(gpsMarker){

                gpsMarker.setLatLng([lat,lng]);

            }else{

                gpsMarker =
                    L.marker([lat,lng]).addTo(miniMap);

            }

            gpsStatus.textContent =
                "✅ GPS Location Acquired";

            gpsStatus.style.color = "green";

        },

        function(error){

            switch(error.code){

                case error.PERMISSION_DENIED:
                    gpsStatus.textContent =
                        "❌ Permission denied.";
                    break;

                case error.POSITION_UNAVAILABLE:
                    gpsStatus.textContent =
                        "❌ Position unavailable.";
                    break;

                case error.TIMEOUT:
                    gpsStatus.textContent =
                        "❌ GPS request timed out.";
                    break;

                default:
                    gpsStatus.textContent =
                        "❌ Unknown GPS error.";

            }

            gpsStatus.style.color = "red";

        },

        {
            enableHighAccuracy:true,
            timeout:15000,
            maximumAge:0
        }

    );

}

document
.getElementById("trigger-gps-btn")
.addEventListener("click", acquireLiveLocation);

function loadPhoto(file){

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(e){

        imageData = e.target.result;

        document.getElementById("previewImage").src =
            imageData;

        document.getElementById("previewImage").style.display =
            "block";

        document.getElementById("photoStatus").textContent =
            "✅ Photo selected";

    };

    reader.readAsDataURL(file);

}

document.getElementById("cameraInput")
.addEventListener("change", function(){

    loadPhoto(this.files[0]);

});

document.getElementById("galleryInput")
.addEventListener("change", function(){

    loadPhoto(this.files[0]);

});

document
.getElementById("pollution-report-form")
.addEventListener("submit", async function(e){

    e.preventDefault();

const barangay =
    document.getElementById("report-barangay").value;

if (
    barangay === "Detecting..." ||
    barangay === "Unknown" ||
    barangay === ""
) {

    alert("Please wait until your barangay has been detected before submitting.");

    return;
}

    const submitBtn =
        document.getElementById("submit-btn");

    const status =
        document.getElementById("status-message");

    submitBtn.disabled = true;
    submitBtn.innerText = "Submitting...";

if(imageData === ""){

    status.style.display = "block";
    status.className = "error-box";

    status.textContent =
        "⚠️ Please take or upload a photo first.";

    submitBtn.disabled = false;
    submitBtn.innerText = "Submit Report";

    return;

}

    const submissionTime = new Date();

    const report = {

        type: document.getElementById("type").value,

        barangay: barangay,

        description: document.getElementById("report-desc").value,

        latitude: parseFloat(
            document.getElementById("report-lat").value
        ),

        longitude: parseFloat(
            document.getElementById("report-lng").value
        ),

        photo: imageData,

        status: "Pending",

        timestamp: submissionTime

    };

// Check if the user is logged in BEFORE sending the request
const token = localStorage.getItem("token");

if (!token) {
    status.style.display = "block";
    status.className = "error-box";
    status.textContent = "🔒 Please log in before submitting a report.";
    submitBtn.disabled = false;
    submitBtn.innerText = "Submit Report";
    return;
}

try {

    const response = await fetch("/reports", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify(report)
    });

    if (response.status === 401) {
        status.style.display = "block";
        status.className = "error-box";
        status.textContent = "🔒 Please log in before submitting a report.";
        submitBtn.disabled = false;
        submitBtn.innerText = "Submit Report";
        return;
    }

    const text = await response.text();
    console.log("Server response:", text);

    let result = {};
    try {
        result = JSON.parse(text);
    } catch (e) {
        console.error("Not JSON:", text);
    }

    console.log(result);


if (!response.ok) {
    throw new Error(result.error || "Server error");
}

const detectedBarangay = result.report.barangay;

        if (response.ok) {

const hours = String(submissionTime.getHours()).padStart(2, "0");
const minutes = String(submissionTime.getMinutes()).padStart(2, "0");
const seconds = String(submissionTime.getSeconds()).padStart(2, "0");
const milliseconds = String(submissionTime.getMilliseconds()).padStart(3, "0");

// Two extra decimal digits (00-99)
const decimal = String(Math.floor(Math.random() * 100)).padStart(2, "0");

const formattedTime =
    `${hours}:${minutes}:${seconds}.${milliseconds}.${decimal}`;            
            const formattedDate = submissionTime.toLocaleDateString();

            status.style.display = "block";
            status.className = "success-box";
            
status.innerHTML = `
🎉 <strong>You successfully reported!</strong><br><br>
📅 <strong>Date:</strong> ${formattedDate}<br>
📍 <strong>Location:</strong> Brgy. ${detectedBarangay} (${report.latitude}, ${report.longitude})<br>
⏰ <strong>Timestamp:</strong> ${formattedTime}
`;
            document
            .getElementById("pollution-report-form")
            .reset();

            document.getElementById("report-lat").value = "";
            document.getElementById("report-lng").value = "";

            imageData = "";

            document.getElementById("previewImage").style.display = "none";
            document.getElementById("previewImage").src = "";
            document.getElementById("photoStatus").textContent =
                "No photo selected.";

            if(gpsMarker){

                miniMap.removeLayer(gpsMarker);

                gpsMarker = null;

            }

            acquireLiveLocation();

        }else{

            status.style.display = "block";
            status.className = "error-box";

status.textContent =
    "❌ Cannot connect to the server.";

        }

}catch(err){
    console.error(err);

    status.style.display = "block";
    status.className = "error-box";
    status.textContent =
        "❌ " + err.message;
}

    submitBtn.disabled = false;

    submitBtn.innerText = "Submit Report";

});

});

async function detectBarangay(lat, lng) {

    try {

        const response = await fetch(
            `/api/barangay?lat=${lat}&lng=${lng}`
        );

        const data = await response.json();

        console.log("Detected barangay:", data.barangay);

        document.getElementById("report-barangay").value =
            data.barangay || "Unknown";

    } catch (err) {

        console.error("Barangay detection failed:", err);

        document.getElementById("report-barangay").value =
            "Unknown";

    }

}

</script>

<script>

const token = localStorage.getItem("token");

if (!token) {

    document.getElementById("loginModal").style.display = "flex";

    document.getElementById("loginNowBtn").onclick = () => {
        window.location.href = "login.html";
    };

    document.getElementById("cancelBtn").onclick = () => {
        document.getElementById("loginModal").style.display = "none";
        window.location.href = "Soil.html";
    };

}

</script>

<script src="js/main.js"></script>

<script>
const menuToggle = document.getElementById("menu-toggle");
const navMenu = document.querySelector(".custom-nav-menu");

if (menuToggle && navMenu) {
    menuToggle.addEventListener("click", () => {
        navMenu.classList.toggle("show");
    });
}
</script>

<div id="loginModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <i class="fa-solid fa-lock"></i>
            <h2>Login Required</h2>
        </div>

        <p>
            You need to sign in before submitting a soil pollution report.
        </p>

        <div class="modal-buttons">
            <button id="loginNowBtn" class="login-btn">
                Log In
            </button>

            <button id="cancelBtn" class="cancel-btn">
                Cancel
            </button>
        </div>
    </div>
</div>

</body>

</html>
