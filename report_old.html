<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Project SUN - Soil Reporting</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

:root{
    --green:#2e7d32;
    --white:#ffffff;
    --dark:#2c3e50;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
}

.navbar{
    background:white;
    padding:18px 30px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.nav-container{
    display:flex;
    justify-content:space-between;
    align-items:center;
    max-width:1200px;
    margin:auto;
}

.logo{
    color:var(--green);
    font-size:24px;
    font-weight:bold;
    text-decoration:none;
}

.nav-menu{
    display:flex;
    gap:25px;
}

.nav-menu a{
    text-decoration:none;
    color:#333;
    font-weight:bold;
}

.nav-menu a.active{
    color:var(--green);
}

.report-main{
    display:flex;
    justify-content:center;
    padding:40px 20px;
}

.report-container{
    width:100%;
    max-width:700px;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,.12);
}

.input-group{
    margin-bottom:18px;
}

.input-group label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    cursor:pointer;
}

#trigger-gps-btn{
    width:100%;
    padding:12px;
    border:none;
    background:var(--green);
    color:white;
    border-radius:8px;
    margin-bottom:10px;
}

#report-mini-map{
    height:260px;
    border-radius:10px;
    margin-top:10px;
}

#submit-btn{
    width:100%;
    padding:15px;
    background:#6d4c41;
    color:white;
    border:none;
    border-radius:8px;
    font-size:17px;
}

.readonly-input{
    background:#eee;
}

.location-row{
    display:flex;
    gap:15px;
}

.location-row .input-group{
    flex:1;
}

</style>

</head>

<body>

<header class="navbar">

<div class="nav-container">

<a class="logo" href="Soil.html">
<i class="fa-solid fa-leaf"></i>
Project SUN
</a>

<nav class="nav-menu">

<a href="Soil.html">Home</a>

<a href="map.html">Interactive Map</a>

<a class="active" href="report.html">
Soil Reporting
</a>

<a href="dashboard.html">
Analytics
</a>

</nav>

</div>

</header>

<main class="report-main">

<div class="report-container">

<h2>🌱 Soil Pollution Report</h2>

<p style="margin:10px 0 25px;">
Submit a soil pollution report with GPS location.
</p>
<form id="pollution-report-form">

<div class="input-group">
<label>Pollution Type</label>

<select id="report-type" required>
<option value="">Select Type</option>
<option value="Critical Spill">Critical Chemical / Oil Spill</option>
<option value="Illegal Waste Dumping">Illegal Waste Dumping</option>
<option value="Industrial Runoff">Industrial Runoff</option>
<option value="Other">Other</option>
</select>
</div>

<div class="input-group">
<label>Description</label>

<textarea
id="report-desc"
rows="4"
placeholder="Describe the pollution..."
required></textarea>
</div>

<div class="input-group">
<label>Upload Photo</label>

<input
type="file"
id="report-photo"
accept="image/*"
required>
</div>

<div class="input-group">

<label>GPS Location</label>

<button
type="button"
id="trigger-gps-btn">

📍 Refresh My GPS Location

</button>

<div id="gps-status">
Initializing GPS...
</div>

<div id="report-mini-map"></div>

</div>

<div class="location-row">

<div class="input-group">

<label>Latitude</label>

<input
type="text"
id="report-lat"
class="readonly-input"
readonly>

</div>

<div class="input-group">

<label>Longitude</label>

<input
type="text"
id="report-lng"
class="readonly-input"
readonly>

</div>

</div>

<button
type="submit"
id="submit-btn">

Submit Report

</button>

<div id="status-message"></div>

</form>

</div>

</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {

try {

const miniMap = L.map("report-mini-map").setView([14.5764,121.0851],13);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
    attribution:"© OpenStreetMap contributors"
}).addTo(miniMap);

let gpsMarker = null;

function acquireLiveLocation(){

    const gpsStatus =
        document.getElementById("gps-status");

    gpsStatus.textContent="📡 Getting GPS location...";
    gpsStatus.style.color="#e67e22";

    if(!navigator.geolocation){

        gpsStatus.textContent=
            "❌ Geolocation is not supported.";

        gpsStatus.style.color="red";

        return;

    }

    navigator.geolocation.getCurrentPosition(

        function(position){

            const lat=position.coords.latitude;
            const lng=position.coords.longitude;

            document.getElementById("report-lat").value=
                lat.toFixed(6);

            document.getElementById("report-lng").value=
                lng.toFixed(6);

            miniMap.setView([lat,lng],17);

            if(!gpsMarker){

                gpsMarker=L.marker([lat,lng]).addTo(miniMap);

            }else{

                gpsMarker.setLatLng([lat,lng]);

            }

            gpsStatus.textContent=
                "✅ GPS Location Acquired";

            gpsStatus.style.color="green";

        },

        function(error){

            switch(error.code){

                case error.PERMISSION_DENIED:
                    gpsStatus.textContent="❌ Permission denied.";
                    break;

                case error.POSITION_UNAVAILABLE:
                    gpsStatus.textContent="❌ Position unavailable.";
                    break;

                case error.TIMEOUT:
                    gpsStatus.textContent="❌ GPS request timed out.";
                    break;

                default:
                    gpsStatus.textContent="❌ Unknown GPS error.";

            }

            gpsStatus.style.color="red";

        },

        {
            enableHighAccuracy:true,
            timeout:15000,
            maximumAge:0
        }

    );

}

acquireLiveLocation();

document
.getElementById("pollution-report-form")
.addEventListener("submit", async function(e){

    e.preventDefault();

    const submitBtn=document.getElementById("submit-btn");
    const status=document.getElementById("status-message");

    submitBtn.disabled=true;
    submitBtn.innerText="Submitting...";

    const report={

        type:document.getElementById("report-type").value,

        description:document.getElementById("report-desc").value,

        latitude:parseFloat(
            document.getElementById("report-lat").value
        ),

        longitude:parseFloat(
            document.getElementById("report-lng").value
        ),

        photo:imageData,

        timestamp:new Date(),

        status:"Pending"

    };

    try{

        const response=await fetch("/reports",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify(report)

        });

        if(response.ok){

            status.style.color="green";

            status.textContent=
                "✅ Report submitted successfully!";

            document
            .getElementById("pollution-report-form")
            .reset();

            document.getElementById("report-lat").value="";
            document.getElementById("report-lng").value="";

            if (gpsMarker) {

    miniMap.removeLayer(gpsMarker);

    gpsMarker = null;

}

            acquireLiveLocation();

        }else{

            status.style.color="red";

            status.textContent=
                "❌ Failed to submit report.";

        }

    catch(err){
    console.error(err);
    alert(err);

    status.style.color="red";
    status.textContent="❌ Cannot connect to the server.";
}

    submitBtn.disabled=false;

    submitBtn.innerText="Submit Report";

});
} catch (err) {
    alert(err.message);
    console.error(err);
}
});
</script>

</body>
</html>
