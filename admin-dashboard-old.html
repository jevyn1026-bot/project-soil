<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ProjectSUN Command Center</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

.report-card{
    background:white;
    border-radius:12px;
    padding:15px;
    margin-bottom:20px;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
}

.report-image{
    width:100%;
    height:180px;
    object-fit:cover;
    border-radius:10px;
    margin-bottom:12px;
}

.no-photo{
    height:180px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#eee;
    border-radius:10px;
    color:#666;
}

.report-card button{
    width:100%;
    margin-top:10px;
    padding:10px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f4f4;
}

header{
background:#1b5e20;
color:white;
padding:18px;
font-size:28px;
font-weight:bold;
}

.container{
display:flex;
height:calc(100vh - 70px);
}

#commandMap{
flex:3;
}

.sidebar{
flex:1;
background:white;
padding:20px;
overflow:auto;
border-left:1px solid #ddd;
}

.report-card{
padding:15px;
margin-bottom:15px;
border-radius:10px;
background:#f8f8f8;
cursor:pointer;
}

.report-card:hover{
background:#eeeeee;
}

</style>

</head>

<body>

<header>

🌱 ProjectSUN Command Center

</header>

<div class="container">

<div id="commandMap"></div>

<div class="sidebar">

<h2>Incoming Reports</h2>

<div id="reportList"></div>

</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map("commandMap")
.setView([14.5764,121.0851],13);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
    attribution:"© OpenStreetMap contributors"
}
).addTo(map);

async function loadReports(){

    const response = await fetch("/reports");
    const reports = await response.json();

    const reportList = document.getElementById("reportList");
    reportList.innerHTML = "";

card.innerHTML = `
    <div class="report-photo">
        
            report.photo
            ? `<img src="${report.photo}" class="report-image">`
            : `<div class="no-photo">No Photo</div>`
        }
    </div>

    <h3>${report.type}</h3>

    <p>${report.description}</p>

    <p><strong>Status:</strong> ${report.status}</p>

    <button onclick="viewLocation(${report.latitude}, ${report.longitude})">
        📍 View on Map
    </button>

    <select onchange="changeStatus('${report.id}', this.value)">
        <option value="Pending" ${report.status==="Pending"?"selected":""}>
            Pending
        </option>

        <option value="In Progress" ${report.status==="In Progress"?"selected":""}>
            In Progress
        </option>

        <option value="Resolved" ${report.status==="Resolved"?"selected":""}>
            Resolved
        </option>
    </select>
`;        
card.onclick = () => {
            map.setView(
                [report.latitude, report.longitude],
                18
            );
            marker.openPopup();
        };

        reportList.appendChild(card);

    });

}

let markersLayer = L.layerGroup().addTo(map);

loadReports();

markersLayer.clearLayers();

function viewLocation(lat,lng){

    map.setView([lat,lng],18);

}

async function changeStatus(id, status){

    const response = await fetch("/reports/" + id,{

        method:"PUT",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            status:status
        })

    });

    if(response.ok){

        loadReports();

    }else{

        alert("Failed to update report.");

    }

}

setInterval(loadReports, 5000);

</script>

const map=L.map("commandMap")
.setView([14.5764,121.0851],13);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
attribution:"© OpenStreetMap contributors"
}
).addTo(map);

</script>

</body>
</html>
