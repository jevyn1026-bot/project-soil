<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrashTrack Leaderboard</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7f6;
}

header{
    background:#2e7d32;
    color:white;
    padding:18px;
    text-align:center;
    font-size:28px;
    font-weight:bold;
}

.container{
    width:95%;
    max-width:900px;
    margin:25px auto;
}

.card{
    background:white;
    border-radius:12px;
    padding:18px;
    margin-bottom:15px;
    box-shadow:0 3px 10px rgba(0,0,0,.1);
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.left{
    display:flex;
    align-items:center;
    gap:15px;
}

.rank{
    font-size:28px;
    width:45px;
    text-align:center;
}

.name{
    font-size:18px;
    font-weight:bold;
}

.info{
    color:#666;
    font-size:14px;
}

.points{
    font-size:22px;
    font-weight:bold;
    color:#2e7d32;
}

.gold{
    background:#fff8dc;
    border-left:8px solid gold;
}

.silver{
    background:#f3f3f3;
    border-left:8px solid silver;
}

.bronze{
    background:#fff1e6;
    border-left:8px solid #cd7f32;
}

.normal{
    border-left:8px solid #2e7d32;
}

.podium{
display:flex;
justify-content:center;
align-items:flex-end;
gap:20px;
margin-bottom:35px;
flex-wrap:wrap;
}

.podium-card{
width:170px;
text-align:center;
color:white;
border-radius:15px 15px 0 0;
padding:15px;
font-weight:bold;
box-shadow:0 5px 15px rgba(0,0,0,.2);
transition:.3s;
}

.podium-card:hover{
transform:translateY(-8px);
}

.first{
background:#FFD700;
color:black;
height:220px;
}

.second{
background:#C0C0C0;
color:black;
height:180px;
}

.third{
background:#CD7F32;
height:150px;
}

.medal{
font-size:48px;
margin-top:10px;
}

.podium-name{
margin-top:20px;
font-size:18px;
font-weight:bold;
}

header{
    position:relative;
}

#menuBtn{
    position:absolute;
    left:15px;
    top:15px;
    background:none;
    border:none;
    color:white;
    font-size:28px;
    cursor:pointer;
}

.mobile-menu{
    display:none;
    position:absolute;
    top:70px;
    left:0;
    width:220px;
    background:white;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
    z-index:1000;
}

.mobile-menu a{
    display:block;
    padding:15px;
    text-decoration:none;
    color:#2e7d32;
}

.mobile-menu a:hover{
    background:#f0f0f0;
}

.mobile-menu.active{
    display:block;
}

</style>

</head>

<body>

<div class="mobile-menu" id="mobileMenu">
    <a href="Soil.html">🏠 Home</a>
    <a href="report.html">📝 Report Improper Waste Management</a>
    <a href="map.html">🗺️ Interactive Map</a>
    <a href="citizen-dashboard.html">👤 My Profile</a>
    <a href="leaderboard.html">🏆 Leaderboard</a>
</div>

<header>
    <button id="menuBtn">☰</button>
    🏆 TrashTrack Leaderboard
</header>

<div class="container" id="leaderboard">
Loading leaderboard...
</div>

<script>

async function loadLeaderboard(){

const response = await fetch("/leaderboard");
const users = await response.json();

const container = document.getElementById("leaderboard");

if (!users || users.length === 0) {
    container.innerHTML = `
        <div class="card" style="text-align:center; display:block;">
            <h2>🏆 No rankings yet</h2>
            <p>Be the first citizen to register and earn Eco Points by submitting verified reports!</p>
        </div>
    `;
    return;
}

container.innerHTML = "";

// Top 3 Podium
if (users.length >= 3) {

container.innerHTML += `
<div class="podium">

<div class="podium-card second">
<div class="medal">🥈</div>
<div class="podium-name">${users[1].fullName}</div>
<div>${users[1].points} pts</div>
<div>🏅 ${getTitle(users[1])}</div>
</div>

<div class="podium-card first">
<div class="medal">🥇</div>
<div class="podium-name">${users[0].fullName}</div>
<div>${users[0].points} pts</div>
<div>🏅 ${getTitle(users[0])}</div>
</div>

<div class="podium-card third">
<div class="medal">🥉</div>
<div class="podium-name">${users[2].fullName}</div>
<div>${users[2].points} pts</div>
<div>🏅 ${getTitle(users[2])}</div>
</div>

</div>
`;

}

users.forEach((user,index)=>{

let medal="🏅";
let cls="normal";

if(index===0){
medal="🥇";
cls="gold";
}
else if(index===1){
medal="🥈";
cls="silver";
}
else if(index===2){
medal="🥉";
cls="bronze";
}

container.innerHTML+=`

<div class="card ${cls}">

<div class="left">

<div class="rank">
${medal}
</div>

<div>

<div class="name">
${user.fullName}
</div>

<div class="info">
⭐ Level ${user.level}
<br>
🏅 ${getTitle(user)}
<br>
✅ ${user.verifiedReports} Verified Reports
</div>

</div>

</div>

<div class="points">
${user.points} pts
</div>

</div>

`;

});

}

function getTitle(user){

    if (!user.badges || user.badges.length === 0) {
        return "🌱 Earth's New Ally";
    }

    return user.badges[user.badges.length - 1];
}

loadLeaderboard();

const menuBtn = document.getElementById("menuBtn");
const mobileMenu = document.getElementById("mobileMenu");

menuBtn.addEventListener("click", () => {
    mobileMenu.classList.toggle("active");
});

</script>

</body>
</html>
